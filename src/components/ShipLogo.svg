<svg id="shipSvg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="18" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#005B82"/>
      <stop offset="50%" stop-color="#00243A"/>
      <stop offset="100%" stop-color="#000D1A"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#80F5FF" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#00E5FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#001220" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hullLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#00405C"/>
    </linearGradient>
    <linearGradient id="hullRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70F3FF"/>
      <stop offset="60%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#00557A"/>
    </linearGradient>
    <linearGradient id="cabinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B2F8FF"/>
      <stop offset="100%" stop-color="#00A3C4"/>
    </linearGradient>
    <linearGradient id="waveFrontGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#00A3C4"/>
      <stop offset="100%" stop-color="#003B5C"/>
    </linearGradient>
    <linearGradient id="waveBackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005B82"/>
      <stop offset="100%" stop-color="#00192B"/>
    </linearGradient>
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <circle cx="250" cy="250" r="220" fill="url(#bgGrad)"/>
  <circle id="glowSphere" cx="250" cy="220" r="130" fill="url(#sunGlow)" filter="url(#neonGlow)"/>
  <polygon points="250,90 220,250 280,250" fill="url(#lightBeam)" opacity="0.25"/>
  <circle cx="250" cy="250" r="220" fill="none" stroke="#00E5FF" stroke-width="3" opacity="0.4"/>
  <circle id="outerRing" cx="250" cy="250" r="210" fill="none" stroke="#00F0FF" stroke-width="5" filter="url(#softGlow)" opacity="0.8"/>
  <circle cx="250" cy="250" r="198" fill="none" stroke="#005B82" stroke-width="1.5" opacity="0.6"/>
  <path d="M 30 290 Q 140 255, 250 290 T 470 290 L 470 450 L 30 450 Z" fill="url(#waveBackGrad)" opacity="0.9"/>
  <rect x="246" y="85" width="8" height="50" fill="#E0FFFF" filter="url(#softGlow)" rx="2"/>
  <rect x="225" y="110" width="50" height="6" fill="#70F3FF" filter="url(#softGlow)" rx="2"/>
  <circle cx="250" cy="85" r="7" fill="#FFFFFF" filter="url(#neonGlow)"/>
  <polygon points="215,150 285,150 280,180 220,180" fill="url(#cabinGrad)"/>
  <line x1="215" y1="150" x2="285" y2="150" stroke="#FFFFFF" stroke-width="3" filter="url(#softGlow)"/>
  <polygon points="198,185 302,185 294,230 206,230" fill="url(#cabinGrad)"/>
  <polygon points="206,196 294,196 292,208 208,208" fill="#001B2E"/>
  <line x1="208" y1="202" x2="292" y2="202" stroke="#60F5FF" stroke-width="4" filter="url(#softGlow)"/>
  <polygon points="250,235 145,300 182,410 250,410" fill="url(#hullLeftGrad)"/>
  <polygon points="250,235 355,300 318,410 250,410" fill="url(#hullRightGrad)"/>
  <line x1="250" y1="232" x2="250" y2="412" stroke="#FFFFFF" stroke-width="4" filter="url(#neonGlow)"/>
  <polygon points="250,235 355,300 335,340 250,285" fill="#FFFFFF" opacity="0.25"/>
  <polygon points="250,235 145,300 170,335 250,280" fill="#00E5FF" opacity="0.2"/>
  <path d="M 30 375 Q 150 320, 270 375 T 470 345 L 470 470 L 30 470 Z" fill="url(#waveFrontGrad)"/>
  <path id="waveGlow" d="M 30 375 Q 150 320, 270 375 T 470 345" fill="none" stroke="#E0FFFF" stroke-width="5" filter="url(#neonGlow)"/>
  <path d="M 30 405 Q 120 370, 220 410 T 470 390 L 470 470 L 30 470 Z" fill="#00E5FF" opacity="0.4"/>
  <path d="M 30 425 Q 180 385, 290 435 T 470 415 L 470 470 L 30 470 Z" fill="#000D1A"/>
</svg>
