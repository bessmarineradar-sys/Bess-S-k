services:
  - type: web
    name: bess-sok-ais-relay
    runtime: node
    plan: free
    rootDir: server
    buildCommand: pnpm install --frozen-lockfile --ignore-workspace
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: AISSTREAM_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://bessmarineradar-sys.github.io,http://localhost:5173,http://127.0.0.1:5173
